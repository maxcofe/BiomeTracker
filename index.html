<!DOCTYPE html>
<html>
<head>
  <title>Minecraft Biome Tracker</title>
  <script src="src/scripts/code.js"></script>
  <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
  <button class="toggle-top-bar" id="toggleTopBar" title="トグルトップバー">▲</button>
  <div class="top-bar">
    <div class="file-upload-wrapper">
      <button class="file-upload-btn">進行状況を適用</button>
      <span id="fileNameDisplay"></span>
      <span id="status"></span>
      <input type="file" id="csvFile" accept=".json" style="display: none;">
    </div>
    <button class="save-button" onclick="saveProgress()">進行状況を保存</button>
    <div class="color-and-size">
      <span>フォント：</span>
      <select id="fontSelector" onchange="updateFont()">
        <option value="Arial, sans-serif">Arial</option>
        <option value="Noto Sans JP, sans-serif">Noto Sans JP</option>
        <option value="M PLUS 1p, sans-serif">M PLUS 1p</option>
        <option value="Sawarabi Gothic, sans-serif">Sawarabi Gothic</option>
        <option value="Roboto, sans-serif">Roboto</option>
        <option value="Open Sans, sans-serif">Open Sans</option>
        <option value="Lato, sans-serif">Lato</option>
        <option value="Montserrat, sans-serif">Montserrat</option>
        <option value="Raleway, sans-serif">Raleway</option>
        <option value="Merriweather, serif">Merriweather</option>
        <option value="Oswald, sans-serif">Oswald</option>
        <option value="Playfair Display, serif">Playfair Display</option>
      </select>
      <input type="text" id="customFont" placeholder="カスタムフォント名を入力" oninput="updateCustomFont()">
      <input type="number" id="fontSizeInput" class="font-size-input" value="14" min="8" max="32">
      <input type="color" id="fontColorPicker" class="color-picker" value="#000000">
    </div>
    <div class="color-and-size">
      <span>背景色：</span>
      <input type="color" id="colorPicker" class="color-picker" value="#00FF00">
    </div>
    <div class="color-and-size">
      <span>リスト背景色：</span>
      <input type="color" id="taskListColorPicker" class="color-picker" value="#FFFFFF">
    </div>
  </div>
  <div class="boxed-section search-section">
    <input type="text" id="biomeSearch" class="search-bar search-bar-boxed" placeholder="バイオーム名を検索">
    <div class="worldFilter">
      <label><input type="checkbox" value="Overworld" checked>Overworld</label>
      <label><input type="checkbox" value="Nether" checked>Nether</label>
      <label><input type="checkbox" value="End" checked>End</label>
      <label><input type="checkbox" value="Other" checked>Other</label>
    </div>
  </div>
  <div id="progress" class="progress boxed-section">
    <span id="progressText">進捗状況: 0 / 0 ( 0.00% )</span>
    <button class="save-progress-btn" onclick="saveProgress()" title="進行状況を保存">
      <svg class="save-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-1 16H6c-.55 0-1-.45-1-1V6c0-.55.45-1 1-1h12v1h1v12c0 .55-.45 1-1 1zm-6-5c0-.55-.45-1-1-1s-1 .45-1 1v2H9c-.55 0-1 .45-1 1s.45 1 1 1h5c.55 0 1-.45 1-1s-.45-1-1-1h-2v-2z"/>
      </svg>
    </button>
  </div>
  <ul id="biomeList"></ul>
</body>
</html>
