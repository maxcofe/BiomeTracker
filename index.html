<!DOCTYPE html>
<html>
<head>
  <title>Minecraft Biome Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #00FF00;
    }
    .top-bar {
      position: fixed;
      top: 0;
      background: #f9f9f9;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
      box-sizing: border-box;
    }
    .search-bar {
      flex-grow: 1;
    }
    .worldFilter {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    #biomeList {
      margin-top: 20px;
      max-height: calc(100vh - 250px);
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      background: #fff;
      width: 80vw;
      margin-left: auto;
      margin-right: auto;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    #biomeList li {
      list-style: none;
      margin: 5px 0;
      display: flex;
      align-items: center;
    }
    #biomeList li input[type="checkbox"] {
      margin-right: 10px;
    }
    #biomeList li .biomeName {
      flex-grow: 1;
    }
    #biomeList li .world {
      margin-left: 20px;
      white-space: nowrap;
    }
    .progress {
      margin-top: 10px;
      font-weight: bold;
    }
    #biomeList::-webkit-scrollbar {
      width: 10px;
    }
    #biomeList::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 10px;
    }
    #biomeList::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    #fontSelector {
      margin-left: 10px;
    }
    #customFont {
      margin-left: 10px;
    }
    .file-upload-wrapper button, .save-button {
      background-color: #FF4500;
    }
    .file-upload-btn, .save-button {
      background-color: #FF4500;
      border: none;
      color: white;
      padding: 5px 10px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    .toggle-top-bar {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 1001;
      padding: 5px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }
    #progress {
      position: sticky;
      top: auto; 
      bottom: 10px; 
      z-index: 3;
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      width: 80vw; 
      margin-left: auto;
      margin-right: auto;
    }
    .boxed-section {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 5px;
      background: #fff;
      margin-bottom: 10px;
    }
    .search-bar-boxed {
      width: 100%;
      box-sizing: border-box;
    }
    .color-and-size {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .color-and-size span {
      white-space: nowrap;
    }
  </style>
  <script src="code.js"></script>
</head>
<body>
  <button class="toggle-top-bar" id="toggleTopBar" title="トグルトップバー">▲</button>
  <div class="top-bar">
    <div class="file-upload-wrapper">
      <button class="file-upload-btn">進行状況をアップロード</button>
      <span id="fileNameDisplay"></span>
      <input type="file" id="csvFile" accept=".csv" style="display: none;">
    </div>
    <button class="save-button" onclick="downloadCSV()">進行状況を保存</button>
    <div class="color-and-size">
      <span>フォント：</span>
      <select id="fontSelector" onchange="updateFont()">
        <option value="Arial, sans-serif">Arial</option>
        <option value="Noto Sans JP, sans-serif">Noto Sans JP</option>
        <option value="M PLUS 1p, sans-serif">M PLUS 1p</option>
        <option value="Sawarabi Gothic, sans-serif">Sawarabi Gothic</option>
        <option value="Roboto, sans-serif">Roboto</option>
        <option value="Open Sans, sans-serif">Open Sans</option>
        <option value="Lato, sans-serif">Lato</option>
        <option value="Montserrat, sans-serif">Montserrat</option>
        <option value="Raleway, sans-serif">Raleway</option>
        <option value="Merriweather, serif">Merriweather</option>
        <option value="Oswald, sans-serif">Oswald</option>
        <option value="Playfair Display, serif">Playfair Display</option>
      </select>
      <input type="text" id="customFont" placeholder="カスタムフォント名を入力" oninput="updateCustomFont()">
      <input type="number" id="fontSizeInput" class="font-size-input" value="14" min="8" max="32">
      <input type="color" id="fontColorPicker" class="color-picker" value="#000000">
    </div>
    <div class="color-and-size">
      <span>背景色：</span>
      <input type="color" id="colorPicker" class="color-picker" value="#FFFFFF">
    </div>
    <div class="color-and-size">
      <span>リスト背景色：</span>
      <input type="color" id="taskListColorPicker" class="color-picker" value="#FFFFFF">
    </div>
  </div>
  <div class="boxed-section">
    <input type="text" id="biomeSearch" class="search-bar search-bar-boxed" placeholder="バイオーム名を検索">
  </div>
  <div class="boxed-section">
    <div class="worldFilter">
      <label><input type="checkbox" value="Overworld" checked>Overworld</label>
      <label><input type="checkbox" value="Nether" checked>Nether</label>
      <label><input type="checkbox" value="End" checked>End</label>
      <label><input type="checkbox" value="Other" checked>Other</label>
    </div>
  </div>
  <div id="progress" class="progress boxed-section">進捗状況: 0 / 0 ( 0.00% )</div>
  <ul id="biomeList"></ul>
</body>
</html>
